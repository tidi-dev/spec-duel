services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USERNAME:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: ${DB_DATABASE:?}
    ports:
      - '${DB_PORT:?}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.2
    ports:
      - '${REDIS_PORT:?}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.10-alpine
    command: ['-m', '8222']
    ports:
      - '${NATS_PORT:?}:4222'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8222/healthz']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
